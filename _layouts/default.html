<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon.svg' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Space+Grotesk:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% seo %}
  {% feed_meta %}
</head>
<body>
  <nav class="vp-nav">
    <a class="vp-nav__logo" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <ul class="vp-nav__links">
      <li><a href="{{ '/' | relative_url }}">Home</a></li>
      <li><a href="{{ '/archive' | relative_url }}">Archive</a></li>
      <li><a href="{{ '/tags' | relative_url }}">Tags</a></li>
      <li><a href="{{ '/about' | relative_url }}">About</a></li>
    </ul>
    <button class="vp-nav__toggle" aria-label="Toggle menu">☰</button>
  </nav>

  {{ content }}

  <footer class="vp-footer">
    <p>{{ site.title }} &middot; {{ site.description | truncate: 50 }} &middot; <a href="{{ '/about' | relative_url }}">About</a></p>
    <p style="margin-top:0.5rem;font-size:0.7rem;">Built with Jekyll &middot; <a href="https://github.com/csswitch/jekyll-vaporwave-theme">Vaporwave Theme</a> by csswitch</p>
  </footer>
  <script src="{{ '/assets/js/vaporwave.js' | relative_url }}"></script>
</body>
</html>
